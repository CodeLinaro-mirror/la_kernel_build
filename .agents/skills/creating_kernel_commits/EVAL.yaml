suite_name: creating-kernel-commits
timeout_seconds: 300
max_tool_calls: 50

cases:
  - name: ack_cherry_pick_upstream
    prompt: >
      I want to cherry-pick an upstream commit to the ACK `common` repository.
      The original commit message is:

      sched/fair: fix bug in enqueue

      This fixes a null pointer dereference in enqueue_task_fair.

      Signed-off-by: John Doe <john.doe@example.com>

      The Android bug is 123456789. The cherry-picked SHA is `abcdef1234567890abcdef1234567890abcdef12`.
      Please draft the commit message for me. Print the drafted commit message in your response.
    skills: [creating-kernel-commits]
    rubric: |
      The agent must:
      - Prefix the subject with 'UPSTREAM:'.
      - Preserve the original subject and body.
      - Add 'Bug: 123456789' footer.
      - Add '(cherry picked from commit ...)' footer.
      - Do NOT add 'Assisted-by:' footer (since this is a clean cherry-pick).
      - If TAG= and CONV= tags are present, place them in a section BEFORE the standard footers (Bug/Test).
      - NOT add a Signed-off-by tag for the agent or user.
      - Prompt the user to sign off themselves.
    expect_keywords:
      - "UPSTREAM: sched/fair: fix bug in enqueue"
      - "Signed-off-by: John Doe <john.doe@example.com>\n\n"
      - "Bug: 123456789"
      - "(cherry picked from commit abcdef1234567890abcdef1234567890abcdef12)"
      - "amend"
      - "sign"
    forbid_keywords:
      - "Assisted-by:"

  - name: kleaf_ad_hoc_change
    prompt: >
      I made a change in `build/kernel` to support a new bazel flag `--experimental_foo`.
      I want to commit it. The change was validated by running `tools/bazel test //build/kernel/kleaf/tests/examples:examples_test`.
      Please draft the commit message.
    skills: [creating-kernel-commits]
    rubric: |
      The agent must:
      - Prefix the subject with 'kleaf:'.
      - Keep the subject line short (ideally under 50 characters).
      - Include a mandatory 'Test:' footer with the bazel command used.
      - Include 'Assisted-by:' footer.
      - NOT add Signed-off-by.
    expect_keywords:
      - "kleaf:"
      - "Test:"
      - "tools/bazel test //build/kernel/kleaf/tests/examples:examples_test"
      - "Assisted-by:"

  - name: prebuilts_toolchain_ad_hoc
    prompt: >
      I updated the `update-prebuilts.sh` script in `prebuilts/kernel-build-tools` to fix a path issue.
      I verified it by running the script manually.
      Please draft the commit message. Draft the message based on this description, without checking the repository. Print the drafted commit message in your response.
    skills: [creating-kernel-commits]
    rubric: |
      The agent must:
      - NOT use the 'kleaf:' prefix in the subject (as it is prebuilts/kernel-build-tools).
      - Include a mandatory 'Test:' footer describing how it was verified.
      - Include 'Assisted-by:' footer.
      - If TAG= and CONV= tags are present, place them in a section BEFORE the standard footers (Bug/Test/Assisted-by).
      - NOT add Signed-off-by.
    expect_keywords:
      - "Test:"
      - "Assisted-by:"

  - name: ack_revert_non_standard_footer
    prompt: >
      I need to revert a commit in `common` repository.
      The commit being reverted is `a1b2c3d4e5f6` ("ANDROID: sched: fix something").
      The reason for revert is that it breaks power measurements on Cuttlefish.
      The Android bug is 987654321.
      Please draft the commit message. Print the drafted commit message in your response.
    skills: [creating-kernel-commits]
    rubric: |
      The agent must:
      - Subject starts with 'Revert "ANDROID: sched: fix something"'.
      - Body contains 'This reverts commit a1b2c3d4e5f6...'.
      - 'Reason for revert:' must be in its own section (surrounded by blank lines) because it has spaces.
      - If TAG= and CONV= tags are present, place them in a section BEFORE the standard footers (Bug/Test/Assisted-by).
      - Include 'Assisted-by:' footer.
      - Prompt the user to sign off.
    expect_keywords:
      - "Revert \"ANDROID: sched: fix something\""
      - "This reverts commit a1b2c3d4e5f6"
      - "Reason for revert:"
      - "Bug: 987654321"
      - "Assisted-by:"

  - name: ack_cherry_pick_fromgit
    prompt: >
      I want to cherry-pick a commit that is in a maintainer tree but not yet in mainline.
      Original commit message:

      scsi: ufs: fix potential deadlock

      This fixes a deadlock scenario in the error handler.

      Signed-off-by: Alice Smith <alice@example.com>

      The Android bug is 111222333.
      The source commit SHA is `1234567890abcdef1234567890abcdef12345678`.
      The repo is `https://git.kernel.org/pub/scm/linux/kernel/git/mkp/scsi.git`.
      The branch is `for-next`.
      Please draft the commit message. Print the drafted commit message in your response.
    skills: [creating-kernel-commits]
    rubric: |
      The agent must:
      - Prefix the subject with 'FROMGIT:'.
      - Preserve the original subject, body, and Sign-off.
      - Add 'Bug: 111222333' footer.
      - Add '(cherry picked from commit ...)' line with SHA, repo URL, and branch.
      - If TAG= and CONV= tags are present, place them in a section BEFORE the standard footers (Bug/Test).
      - Do NOT add 'Assisted-by:' footer (since this is a clean cherry-pick).
      - NOT add Signed-off-by.
      - Prompt the user to sign off.
    expect_keywords:
      - "FROMGIT: scsi: ufs: fix potential deadlock"
      - "Signed-off-by: Alice Smith <alice@example.com>\n\n"
      - "cherry picked from commit 1234567890abcdef1234567890abcdef12345678\n https://git.kernel.org/pub/scm/linux/kernel/git/mkp/scsi.git for-next"
      - "amend"
      - "sign"
    forbid_keywords:
      - "Assisted-by:"

  - name: ack_cherry_pick_fromlist
    prompt: >
      I want to cherry-pick a patch that was submitted to LKML but is not in any tree yet.
      Original commit message:

      net: core: optimize packet handling

      This improves throughput by 5%.

      Signed-off-by: Bob Brown <bob@example.com>

      The Android bug is 444555666.
      The mailing list link is `https://lore.kernel.org/lkml/20260520123456.GA12345@example.com/`.
      Please draft the commit message. Print the drafted commit message in your response.
    skills: [creating-kernel-commits]
    rubric: |
      The agent must:
      - Prefix the subject with 'FROMLIST:'.
      - Preserve the original subject, body, and Sign-off.
      - Add 'Bug: 444555666' footer.
      - Add 'Link:' footer with the lore.kernel.org link.
      - If TAG= and CONV= tags are present, place them in a section BEFORE the standard footers (Bug/Test).
      - Do NOT add 'Assisted-by:' footer (since this is a clean cherry-pick).
      - NOT add Signed-off-by.
      - Prompt the user to sign off.
    expect_keywords:
      - "FROMLIST: net: core: optimize packet handling"
      - "Signed-off-by: Bob Brown <bob@example.com>\n\n"
      - "Link: https://lore.kernel.org/lkml/20260520123456.GA12345@example.com/"
      - "amend"
      - "sign"
    forbid_keywords:
      - "Assisted-by:"

  - name: ack_missing_bug_number
    prompt: >
      I want to cherry-pick an upstream commit to the ACK `common` repository.
      The original commit message is:

      sched/fair: fix bug in enqueue

      This fixes a null pointer dereference in enqueue_task_fair.

      Signed-off-by: John Doe <john.doe@example.com>

      The cherry-picked SHA is `abcdef1234567890abcdef1234567890abcdef12`.
      Please draft the commit message for me.
    skills: [creating-kernel-commits]
    rubric: |
      The agent must:
      - Ask the user to provide a bug ID/number.
    expect_keywords_any:
      - "bug"
      - "ask"
      - "provide"
      - "request"

  # Needed due to b/517689798
  - name: kleaf_ad_hoc_change_with_tags
    prompt: >
      I made a change in `build/kernel` to support a new bazel flag `--experimental_foo`.
      I want to commit it.
      No tests were run, and no Test: line is needed.
      No bug was filed, and no Bug: line is needed.
      Please draft the commit message.
      Include the following tracking tags: `TAG=agy` and `CONV=12345`.
    skills: [creating-kernel-commits]
    rubric: |
      The agent must:
      - Prefix the subject with 'kleaf:'.
      - Keep the subject line short (ideally under 50 characters).
      - Include 'Assisted-by:' footer.
      - Place TAG= and CONV= tags in a section BEFORE the standard footer (Assisted-by).
      - NOT add Signed-off-by.
      - NOT include a 'Test:' footer.
      - NOT include a 'Bug:' footer.
    expect_keywords:
      - "kleaf:"
      - "Assisted-by:"
    expect_keywords_any:
      - "TAG=agy\nCONV=12345\n\nAssisted-by:"
      - "TAG=agy\nCONV=12345\n\nTest:"
      - "TAG=agy\nCONV=12345\n\nBug:"
